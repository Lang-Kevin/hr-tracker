android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m
# AGP 9.x built-in Kotlin conflicts with Hilt's BaseExtension lookup; disable until Hilt supports AGP 9.x natively
android.builtInKotlin=false
android.newDsl=false
