name: Android CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # includeBuild zeigt (relativ zu code/) auf ../../shared-app-lib (sharedLibPath-Default):
      #   ws/hr-tracker/code  ->  ws/shared-app-lib
      - uses: actions/checkout@v4
        with:
          path: ws/hr-tracker

      # Gleichnamiger Branch in shared-app-lib, falls vorhanden (App- und Lib-Änderungen
      # zusammen testen), sonst master.
      - name: Shared-Lib-Ref bestimmen
        id: lib
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/Lang-Kevin/shared-app-lib "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: Lang-Kevin/shared-app-lib
          ref: ${{ steps.lib.outputs.ref }}
          path: ws/shared-app-lib

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Runner bringt ein Android-SDK (ANDROID_HOME) mit akzeptierten Lizenzen mit;
      # fehlende Plattformen (compileSdk 37) laedt AGP selbst nach.
      - name: Build und Unit-Tests
        working-directory: ws/hr-tracker/code
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Test-Reports hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ws/hr-tracker/code/app/build/reports/
          if-no-files-found: ignore
