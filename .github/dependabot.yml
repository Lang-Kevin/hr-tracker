version: 2
updates:
  # Versionskatalog code/gradle/libs.versions.toml
  - package-ecosystem: gradle
    directory: /code
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      androidx:
        patterns:
          - "androidx.*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
